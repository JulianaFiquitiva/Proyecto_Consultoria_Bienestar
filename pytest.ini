[pytest]
testpaths = tests
# Por defecto NO corren las pruebas que usan internet u OpenAI (cuestan
# dinero y dependen de la red). Para correrlas: pytest -m red
addopts = -m "not red"
markers =
    red: usa internet (OpenAI, Crossref, PubMed); excluida por defecto
    datos: necesita los Excel de la encuesta en data/ (se salta si faltan)
